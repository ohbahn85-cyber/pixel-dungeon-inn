<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>픽셀 던전 여관: 카이로 슬롯 타이쿤 (Pixel Dungeon Inn)</title>
    <meta name="description" content="카이로소프트 스타일 쿼터뷰 여관·대장간·포션가게·거래처 경영 & 슬롯머신 RPG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-shell">
      <!-- 상단 카이로소프트풍 HUD 바 (좌측 5Y 4M 3W 우드 플래그 + 우측 골드/마일리지/영웅 플래그) -->
      <header id="kairo-top-hud">
        <div class="kairo-calendar-plaque">
          <span class="blossom-icon">🌸</span>
          <strong id="hud-calendar">1Y  1M  1W</strong>
          <div class="week-gauge"><div class="week-gauge-fill"></div></div>
        </div>

        <div class="kairo-title-banner">
          <h1>🏰 픽셀 던전 여관: 슬롯 타이쿤</h1>
        </div>

        <div class="kairo-resource-cluster">
          <div class="res-pill gold-pill" title="보유 골드">
            <span class="res-icon">🪙</span>
            <strong id="hud-gold">850G</strong>
          </div>
          <div class="res-pill scrap-pill" title="슬롯 [버리기]로 모은 마일리지 가루 (거래처에서 확정 교환)">
            <span class="res-icon">♻️</span>
            <small>가루</small>
            <strong id="hud-scrap">15</strong>
          </div>
          <div class="res-pill hero-pill" title="여관 소속 영웅 수">
            <span class="res-icon">🦸</span>
            <strong id="hud-heroes">2명</strong>
          </div>
        </div>
      </header>

      <!-- 메인 아이소메트릭 쿼터뷰 캔버스 영역 -->
      <main id="iso-stage">
        <canvas id="iso-canvas"></canvas>

        <!-- 던전 원정 진행 중일 때 뜨는 실시간 전투 슬롯 & 보상 슬롯 오버레이 -->
        <section id="dungeon-live-panel" class="hidden"></section>
      </main>

      <!-- 하단 카이로소프트풍 조작 도크 바 -->
      <footer id="kairo-bottom-dock">
        <button class="kairo-corner-btn" data-open-tab="save_manage">
          💾 Save / 백업
        </button>

        <div class="kairo-dock-center">
          <button class="dock-btn inn-btn" data-open-tab="inn_cook">
            <span class="dock-icon">🍲</span>
            <span>여관·요리슬롯</span>
          </button>
          <button class="dock-btn hero-btn" data-open-tab="inn_hero">
            <span class="dock-icon">🦸</span>
            <span>영웅영입·성장</span>
          </button>
          <button class="dock-btn bs-btn" data-open-tab="bs_forge">
            <span class="dock-icon">⚒️</span>
            <span>대장간 3종슬롯</span>
          </button>
          <button class="dock-btn pot-btn" data-open-tab="potion_brew">
            <span class="dock-icon">🧪</span>
            <span>포션가게 슬롯</span>
          </button>
          <button class="dock-btn trade-btn" data-open-tab="trade_market">
            <span class="dock-icon">💎</span>
            <span>거래처·교환소</span>
          </button>
          <button class="dock-btn staff-btn" data-open-tab="staff_hire">
            <span class="dock-icon">👨‍🍳</span>
            <span>직원고용 슬롯</span>
          </button>
          <button class="dock-btn fac-btn" data-open-tab="facility_up">
            <span class="dock-icon">🏰</span>
            <span>시설업그레이드</span>
          </button>
        </div>

        <button class="kairo-corner-btn dungeon-go-btn" data-open-tab="dungeon_prep">
          ⚔️ 던전 출정
        </button>
      </footer>

      <!-- 슬롯머신 & 시설 운영 모달 다이얼로그 -->
      <div id="modal-backdrop" class="hidden">
        <div id="kairo-modal-window">
          <div class="modal-top-bar">
            <h2 id="modal-title">시설 슬롯머신</h2>
            <button id="modal-close-btn" aria-label="닫기">✕ 닫기</button>
          </div>

          <nav class="modal-quick-nav">
            <button class="modal-nav-pill" data-open-tab="inn_cook">🍲 요리슬롯</button>
            <button class="modal-nav-pill" data-open-tab="inn_hero">🦸 영웅영입</button>
            <button class="modal-nav-pill" data-open-tab="bs_forge">🔨 무기제작</button>
            <button class="modal-nav-pill" data-open-tab="bs_enhance">⚒️ 연속강화</button>
            <button class="modal-nav-pill" data-open-tab="bs_enchant">✨ 마법인챈트</button>
            <button class="modal-nav-pill" data-open-tab="potion_brew">🧪 포션연금</button>
            <button class="modal-nav-pill" data-open-tab="trade_market">💎 거래처</button>
            <button class="modal-nav-pill" data-open-tab="staff_hire">👨‍🍳 직원고용</button>
            <button class="modal-nav-pill" data-open-tab="facility_up">🏰 시설증축</button>
            <button class="modal-nav-pill" data-open-tab="dungeon_prep">⚔️ 던전원정</button>
          </nav>

          <div id="modal-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
