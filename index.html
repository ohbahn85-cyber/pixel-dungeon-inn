<!doctype html>
<html lang="ko">
  <head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%236d577e%22/><rect x=%226%22 y=%226%22 width=%224%22 height=%224%22 fill=%22%23f2d675%22/></svg>">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>픽셀 던전 여관: 카이로 슬롯 타이쿤 (Pixel Dungeon Inn)</title>
    <meta name="description" content="카이로소프트 스타일 쿼터뷰 여관·대장간·포션가게·거래처 경영 & 슬롯머신 RPG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-shell">
      <header id="kairo-top-hud">
        <div class="kairo-calendar-plaque" title="여관 달력">
          <strong id="hud-calendar">1Y 1M 1W</strong>
          <div class="week-gauge"><div class="week-gauge-fill"></div></div>
        </div>
        <div class="kairo-resource-cluster">
          <div class="res-pill gold-pill" title="골드">
            <span class="res-icon pix-gold"></span>
            <strong id="hud-gold">850</strong>
          </div>
          <div class="res-pill scrap-pill" title="마일리지 가루">
            <span class="res-icon pix-scrap"></span>
            <strong id="hud-scrap">15</strong>
          </div>
          <div class="res-pill hero-pill" title="소속 영웅">
            <span class="res-icon pix-hero"></span>
            <strong id="hud-heroes">2</strong>
          </div>
        </div>
      </header>

      <main id="iso-stage">
        <canvas id="iso-canvas"></canvas>
        <button id="expedition-chip" class="hidden" title="원정 보기">
          <span class="exp-icon"></span>
          <span class="exp-wave">1/3</span>
        </button>
        <section id="dungeon-stage" class="hidden">
          <canvas id="dungeon-canvas"></canvas>
          <div id="dungeon-hud" class="hidden"></div>
          <button id="dungeon-back-btn" title="여관으로">여관</button>
        </section>
      </main>

      <footer id="kairo-bottom-dock">
        <button class="kairo-corner-btn" data-open-tab="save_manage" title="저장 / 백업">저장</button>
        <div class="kairo-dock-center">
          <button class="dock-btn inn-btn" data-open-tab="inn_cook" title="요리">🍲</button>
          <button class="dock-btn hero-btn" data-open-tab="inn_hero" title="영입">🦸</button>
          <button class="dock-btn bs-btn" data-open-tab="bs_forge" title="대장간">⚒️</button>
          <button class="dock-btn pot-btn" data-open-tab="potion_brew" title="포션">🧪</button>
          <button class="dock-btn trade-btn" data-open-tab="trade_market" title="거래">💎</button>
          <button class="dock-btn staff-btn" data-open-tab="staff_hire" title="직원">👤</button>
          <button class="dock-btn fac-btn" data-open-tab="facility_up" title="시설">🏠</button>
        </div>
        <button class="kairo-corner-btn dungeon-go-btn" data-open-tab="dungeon_prep" title="던전 출정">출정</button>
      </footer>

      <!-- 슬롯머신 & 시설 운영 모달 다이얼로그 -->
      <div id="modal-backdrop" class="hidden">
        <div id="kairo-modal-window">
          <div class="modal-top-bar">
            <h2 id="modal-title">시설 슬롯머신</h2>
            <button id="modal-close-btn" aria-label="닫기">✕</button>
          </div>

          <nav class="modal-quick-nav">
            <button class="modal-nav-pill" data-open-tab="inn_cook" title="요리">🍲</button>
            <button class="modal-nav-pill" data-open-tab="inn_hero" title="영입">🦸</button>
            <button class="modal-nav-pill" data-open-tab="bs_forge" title="제작">🔨</button>
            <button class="modal-nav-pill" data-open-tab="bs_enhance" title="강화">⬆️</button>
            <button class="modal-nav-pill" data-open-tab="bs_enchant" title="인챈트">✨</button>
            <button class="modal-nav-pill" data-open-tab="potion_brew" title="포션">🧪</button>
            <button class="modal-nav-pill" data-open-tab="trade_market" title="거래">💎</button>
            <button class="modal-nav-pill" data-open-tab="staff_hire" title="직원">👤</button>
            <button class="modal-nav-pill" data-open-tab="facility_up" title="시설">🏠</button>
            <button class="modal-nav-pill" data-open-tab="dungeon_prep" title="출정">⚔️</button>
          </nav>

          <div id="modal-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
