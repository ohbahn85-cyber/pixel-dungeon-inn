<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대표 캐릭터 1종: 앞 · 뒤 · 좌 · 우 4방향 디자인 시트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="sheet-shell">
      <header id="sheet-header">
        <div>
          <span class="badge-pill">대표 캐릭터 1종 · 4방향 디자인 검수</span>
          <h1>🔨 대장장이 명장 (발칸) — 앞(Front) · 뒤(Back) · 좌(Left) · 우(Right)</h1>
        </div>
        <div class="action-bar">
          <button class="anim-btn active" data-state="idle">😌 기본 서있기 (Idle)</button>
          <button class="anim-btn" data-state="walk">🏃 걷기 모션 (Walk)</button>
          <button class="anim-btn" data-state="work">🔨 망치질 작업 (Work)</button>
        </div>
      </header>

      <main id="four-way-grid">
        <div class="view-card">
          <div class="view-label">1. 정면 (FRONT · 앞모습)</div>
          <canvas id="canvas-front" width="280" height="300"></canvas>
        </div>

        <div class="view-card">
          <div class="view-label">2. 후면 (BACK · 뒷모습)</div>
          <canvas id="canvas-back" width="280" height="300"></canvas>
        </div>

        <div class="view-card">
          <div class="view-label">3. 좌측면 (LEFT · 왼쪽 모습)</div>
          <canvas id="canvas-left" width="280" height="300"></canvas>
        </div>

        <div class="view-card">
          <div class="view-label">4. 우측면 (RIGHT · 오른쪽 모습)</div>
          <canvas id="canvas-right" width="280" height="300"></canvas>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
